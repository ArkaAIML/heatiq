<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeatIQ Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-red: #DF301C;
            --color-orange: #FF9100;
            --color-light: #FFF1D1;
            --color-cyan: #00B7CD;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #030305;
            color: white;
        }

        /* --- AURORA BACKGROUND --- */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            background: #0a0a14;
            transition: filter 0.8s ease, opacity 0.8s ease;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            mix-blend-mode: normal; /* Alpha blending for pure vibrant colors */
            will-change: transform, opacity;
        }

        /* Layer 1: Left Cyan */
        .blob-1 {
            width: 120vw;
            height: 120vh;
            background: var(--color-cyan);
            top: -10%;
            left: -40%;
            animation: drift-1 40s infinite alternate ease-in-out;
            opacity: 0.85;
        }

        /* Layer 2: Right Orange/Red */
        .blob-2 {
            width: 120vw;
            height: 120vh;
            background: var(--color-red);
            bottom: -20%;
            right: -40%;
            animation: drift-2 50s infinite alternate-reverse ease-in-out;
            opacity: 0.85;
        }

        /* Layer 3: Middle Cream/Yellow */
        .blob-3 {
            width: 100vw;
            height: 100vh;
            background: var(--color-light);
            top: 10%;
            left: 10%;
            animation: drift-3 45s infinite alternate ease-in-out;
            opacity: 0.7;
        }

        /* Layer 4: Deep Orange overlay */
        .blob-4 {
            width: 90vw;
            height: 90vh;
            background: var(--color-orange);
            bottom: 10%;
            right: 10%;
            animation: pulse-light 55s infinite alternate ease-in-out;
            opacity: 0.8;
        }

        /* Layer 5: Sweeping Cyan highlight */
        .blob-5 {
            width: 100vw;
            height: 100vh;
            background: var(--color-cyan);
            top: 30%;
            left: 20%;
            animation: sweeping-pulse 60s infinite linear alternate;
            opacity: 0.6;
            mix-blend-mode: screen; /* Only this one uses screen to pop highlights */
        }

        @keyframes drift-1 {
            0% { transform: translate(0, 0) scale(1.1); opacity: 0.7; }
            100% { transform: translate(15vw, 10vh) scale(1.3); opacity: 0.9; }
        }

        @keyframes drift-2 {
            0% { transform: translate(0, 0) scale(1.2); opacity: 0.8; }
            100% { transform: translate(-15vw, -20vh) scale(1.1); opacity: 0.9; }
        }

        @keyframes drift-3 {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0.6; }
            100% { transform: translate(10vw, 20vh) scale(1.2) rotate(45deg); opacity: 0.8; }
        }

        @keyframes pulse-light {
            0% { transform: translate(0, 0) scale(1); opacity: 0.7; }
            100% { transform: translate(-20vw, 15vh) scale(1.4); opacity: 0.9; }
        }

        @keyframes sweeping-pulse {
            0% { transform: translate(-30vw, -30vh) scale(1); opacity: 0.4; }
            100% { transform: translate(30vw, 30vh) scale(1.3); opacity: 0.7; }
        }

        /* Add a noise overlay for texture */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.08; /* Slightly stronger noise */
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* --- LOGO --- */
        .logo {
            position: absolute;
            top: 2rem;
            left: 2.5rem;
            z-index: 10;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: rgba(0, 0, 0, 0.85); /* Dark gray/black for IQ */
            text-transform: uppercase;
            animation: breathe 4s infinite alternate ease-in-out;
            pointer-events: none;
            user-select: none;
        }

        .logo .highlight {
            color: var(--color-red); /* Darker red from palette for HEAT */
            font-weight: 400;
        }

        @keyframes breathe {
            0% { opacity: 0.8; text-shadow: 0 0 10px rgba(0, 0, 0, 0); }
            100% { opacity: 1; text-shadow: 0 0 15px rgba(255, 255, 255, 0.5); }
        }

        /* --- CENTRAL COMPOSITION --- */
        .central-composition {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .central-halo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 183, 205, 0.25) 0%, rgba(0, 183, 205, 0) 70%);
            z-index: -1;
            pointer-events: none;
            animation: pulse-halo 6s infinite alternate ease-in-out;
        }

        @keyframes pulse-halo {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* LIQUID GLASS UI */
        .btn-glass {
            background: rgba(0, 183, 205, 0.15); /* darker cyan interior */
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 2px solid rgba(0, 183, 205, 0.4); /* cyan border */
            color: #004d56; /* Dark cyan text/icon for contrast against bright background */
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            outline: none;
            position: relative;
        }

        .btn-glass::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .btn-glass-cyan {
            box-shadow: 0 4px 30px rgba(0, 183, 205, 0.2), inset 0 0 20px rgba(0, 183, 205, 0.1);
        }

        .btn-glass-cyan:hover {
            box-shadow: 0 4px 40px rgba(0, 183, 205, 0.4), inset 0 0 20px rgba(0, 183, 205, 0.3);
            transform: scale(1.05);
            background: rgba(0, 183, 205, 0.25);
        }
        
        .btn-glass-cyan:active {
            transform: scale(0.95);
        }

        .input-glass {
            background: rgba(255, 145, 0, 0.1); /* warmer orange glass */
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 2px solid rgba(255, 145, 0, 0.4); /* darker orange border */
            color: #4a2a00; /* Darker text for readability */
            border-radius: 30px;
            padding: 1.2rem 2.5rem;
            font-size: 1.1rem;
            font-family: 'Fira Code', monospace;
            text-align: center;
            width: 400px;
            outline: none;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 10px 40px rgba(255, 145, 0, 0.15), inset 0 0 20px rgba(255, 145, 0, 0.1);
        }

        .input-glass::placeholder {
            color: rgba(0, 0, 0, 0.4); /* darker placeholder */
            font-family: 'Inter', sans-serif;
            font-weight: 400;
        }

        .input-glass:focus {
            background: rgba(255, 145, 0, 0.2);
            border-color: rgba(255, 145, 0, 0.6);
            box-shadow: 0 10px 50px rgba(255, 145, 0, 0.3), inset 0 0 30px rgba(255, 145, 0, 0.2);
            transform: scale(1.02);
            color: #331d00;
        }

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: rgba(10, 10, 15, 0.4);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 20px;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            transform: translateY(20px);
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            width: 90%;
            max-width: 500px;
            position: relative;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-halo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            border-radius: 50%;
            z-index: -1;
            filter: blur(50px);
            pointer-events: none;
            animation: modal-breathe 4s infinite alternate ease-in-out;
        }

        @keyframes modal-breathe {
            0% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.05); }
        }

        /* Create Modal (Orange) */
        .modal-create {
            border: 1px solid rgba(255, 145, 0, 0.3);
            box-shadow: 0 20px 60px rgba(255, 145, 0, 0.15), inset 0 0 40px rgba(255, 145, 0, 0.05);
        }
        .modal-create .modal-halo { background: radial-gradient(circle, rgba(255, 145, 0, 0.2) 0%, rgba(255, 145, 0, 0) 70%); }
        .modal-create h2 { color: rgba(255, 255, 255, 0.9); font-weight: 400; font-size: 1.2rem; margin: 0; }
        
        .key-display {
            font-family: 'Fira Code', monospace;
            font-size: 1.1rem;
            color: var(--color-orange);
            background: rgba(0,0,0,0.3);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 145, 0, 0.2);
            word-break: break-all;
            text-align: center;
            width: 100%;
        }

        /* Revoke Modal (Red) */
        .modal-revoke {
            border: 1px solid rgba(223, 48, 28, 0.3);
            box-shadow: 0 20px 60px rgba(223, 48, 28, 0.15), inset 0 0 40px rgba(223, 48, 28, 0.05);
        }
        .modal-revoke .modal-halo { background: radial-gradient(circle, rgba(223, 48, 28, 0.2) 0%, rgba(223, 48, 28, 0) 70%); }
        .modal-revoke h2 { color: rgba(255, 255, 255, 0.9); font-weight: 400; font-size: 1.2rem; margin: 0; text-align: center; }

        .modal-actions {
            display: flex;
            gap: 1rem;
            width: 100%;
        }

        .btn-text {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-text:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-action-orange {
            background: rgba(255, 145, 0, 0.1);
            border-color: rgba(255, 145, 0, 0.4);
            color: var(--color-orange);
        }
        .btn-action-orange:hover {
            background: rgba(255, 145, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 145, 0, 0.3);
        }

        .btn-action-red {
            background: rgba(223, 48, 28, 0.15);
            border-color: rgba(223, 48, 28, 0.5);
            color: #ff8a80;
        }
        .btn-action-red:hover {
            background: rgba(223, 48, 28, 0.3);
            box-shadow: 0 0 20px rgba(223, 48, 28, 0.4);
        }

        /* State Classes */
        body.modal-open .aurora-bg {
            filter: brightness(0.6) saturate(0.8);
        }
        body.modal-open .central-composition {
            opacity: 0.2;
            pointer-events: none;
        }

        .copy-confirm {
            position: absolute;
            bottom: -25px;
            font-size: 0.8rem;
            color: var(--color-orange);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
        }
        .copy-confirm.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Accessibility: Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            .blob { animation: none !important; }
            .central-halo { animation: none !important; }
            .logo { animation: none !important; }
            .modal-halo { animation: none !important; }
            * { transition-duration: 0.1s !important; }
        }
    </style>
</head>
<body>

    <!-- Background -->
    <div class="aurora-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="blob blob-5"></div>
    </div>
    <div class="noise-overlay"></div>

    <!-- Logo -->
    <div class="logo"><span class="highlight">HEAT</span>IQ</div>

    <!-- Central Controls -->
    <div class="central-composition">
        <div class="central-halo"></div>
        
        <button id="btn-open-create" class="btn-glass btn-glass-cyan" aria-label="Create API Key">+</button>
        
        <input type="text" id="api-key-input" class="input-glass" placeholder="Enter your API key" autocomplete="off" spellcheck="false">
        
        <button id="btn-open-revoke" class="btn-glass btn-glass-cyan" aria-label="Search or Revoke Key">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </button>
    </div>

    <!-- Create Modal -->
    <div id="modal-create-overlay" class="modal-overlay">
        <div class="modal modal-create">
            <div class="modal-halo"></div>
            <h2>Your HeatIQ API Key</h2>
            <div class="key-display" id="generated-key-display">Generating...</div>
            <div class="modal-actions">
                <button class="btn-text" onclick="closeModals()">Close</button>
                <div style="position: relative; flex: 1; display: flex; justify-content: center;">
                    <button class="btn-text btn-action-orange" style="width: 100%;" onclick="copyKey()">Copy to clipboard</button>
                    <div id="copy-confirm" class="copy-confirm">✓ Copied</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Revoke Modal -->
    <div id="modal-revoke-overlay" class="modal-overlay">
        <div class="modal modal-revoke">
            <div class="modal-halo"></div>
            <h2>Do you want to revoke this key?</h2>
            <div class="modal-actions">
                <button class="btn-text" onclick="closeModals()">Cancel</button>
                <button class="btn-text btn-action-red" onclick="revokeKey()">Revoke</button>
            </div>
        </div>
    </div>

    <script>
        const inputField = document.getElementById('api-key-input');
        const btnCreate = document.getElementById('btn-open-create');
        const btnRevoke = document.getElementById('btn-open-revoke');
        
        const overlayCreate = document.getElementById('modal-create-overlay');
        const overlayRevoke = document.getElementById('modal-revoke-overlay');
        const keyDisplay = document.getElementById('generated-key-display');
        
        let currentKeyToCopy = "";
        let currentKeyToRevoke = "";

        // Modal Controls
        function openModal(type) {
            document.body.classList.add('modal-open');
            if (type === 'create') overlayCreate.classList.add('active');
            if (type === 'revoke') overlayRevoke.classList.add('active');
        }

        function closeModals() {
            document.body.classList.remove('modal-open');
            overlayCreate.classList.remove('active');
            overlayRevoke.classList.remove('active');
            inputField.value = "";
            document.getElementById('copy-confirm').classList.remove('show');
        }

        // Actions
        btnCreate.addEventListener('click', async () => {
            keyDisplay.textContent = "Generating...";
            openModal('create');
            
            try {
                const response = await fetch('/api/keys', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ label: 'Gateway Generated Key' })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    currentKeyToCopy = data.api_key;
                    keyDisplay.textContent = data.api_key;
                } else {
                    keyDisplay.textContent = "Error generating key.";
                }
            } catch (err) {
                keyDisplay.textContent = "Connection error.";
            }
        });

        btnRevoke.addEventListener('click', () => {
            const val = inputField.value.trim();
            if (val) {
                currentKeyToRevoke = val;
                openModal('revoke');
            } else {
                // Shake or pulse input to indicate it's empty
                inputField.style.transform = 'scale(0.95)';
                setTimeout(() => inputField.style.transform = '', 150);
                inputField.focus();
            }
        });

        // Key Press on Input
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btnRevoke.click();
            }
        });

        function copyKey() {
            if (!currentKeyToCopy) return;
            navigator.clipboard.writeText(currentKeyToCopy).then(() => {
                const confirmEl = document.getElementById('copy-confirm');
                confirmEl.classList.add('show');
                setTimeout(() => confirmEl.classList.remove('show'), 2000);
            });
        }

        async function revokeKey() {
            if (!currentKeyToRevoke) return;
            
            try {
                const response = await fetch('/api/keys', {
                    method: 'DELETE',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ key_id: currentKeyToRevoke })
                });
                
                if (response.ok) {
                    closeModals();
                    // Optional: Brief flash on the input
                    inputField.value = "Revoked successfully.";
                    inputField.style.color = "var(--color-orange)";
                    setTimeout(() => {
                        inputField.value = "";
                        inputField.style.color = "";
                    }, 1500);
                } else {
                    alert("Failed to revoke key or key not found.");
                    closeModals();
                }
            } catch (err) {
                alert("Network error.");
                closeModals();
            }
        }
    </script>
</body>
</html>
